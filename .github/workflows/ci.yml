name: CI

on:
  push:
    branches: [main, develop]
    # web/ has its own pipeline (.github/workflows/web-ci.yml) with its
    # own toolchain (Node, not Go) — a PR that only touches it doesn't
    # need this gate, and shouldn't wait ~1m30 for a Postgres service
    # container that nothing here will even query. See
    # docs/DECISIONS.md § "Frontend: Vite (SPA), monorepo em web/,
    # mesma linha de versão do repo".
    paths-ignore: ['web/**']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['web/**']
  workflow_dispatch:

permissions:
  contents: read

# Um push novo na mesma branch torna a execução anterior obsoleta. Sem isto
# elas se acumulam e disputam o runner — o gate leva ~1m30, mas prende um
# runner por todo esse tempo para produzir um resultado que ninguém vai ler.
#
# main e develop ficam de fora do cancelamento: lá cada commit é um ponto da
# história que se quer saber se passou, não um passo intermediário de PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    # O gate leva ~1m30 com o cache quente. 15 minutos dão folga de uma ordem
    # de grandeza e ainda cortam cedo o que interessa: um deadlock sob -race,
    # um MinIO que passou do loop de espera mas não responde, uma query
    # pendurada contra o service container. Sem isto o padrão do runner é
    # 6 horas — tempo suficiente para um teste travado consumir a cota do dia.
    timeout-minutes: 15

    # Backs internal/task and internal/user's postgresRepository
    # integration tests (*_postgres_repository_test.go, built only with
    # -tags=integration — see the "Test (integration)" step below).
    # Without this service and that step, those tests would never actually
    # run in CI at all.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: task_api
          POSTGRES_PASSWORD: task_api
          POSTGRES_DB: task_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_api -d task_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # MinIO is started by a step rather than declared under services:
      # — see "Start MinIO" below for why it cannot be one.
      TEST_S3_ENDPOINT: localhost:9000
      TEST_S3_ACCESS_KEY: task_api
      TEST_S3_SECRET_KEY: task_api_secret
      TEST_DATABASE_URL: postgres://task_api:task_api@localhost:5432/task_api?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go-version-file reads the Go version straight from go.mod, so the
      # workflow always builds with the exact version the project pins
      # instead of a hardcoded value that can drift out of sync.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Backs internal/attachment's S3 integration tests — the same
      # assertions the filesystem store runs, against a real
      # S3-compatible server. Without it those tests skip, which would
      # leave the S3 backend exercised by nobody until production.
      #
      # A step rather than a `services:` entry, and not by preference: a
      # service container cannot be given a command, and the minio image
      # needs `server /data` — without it the container prints its usage
      # and exits. Bitnami's auto-starting image would fit the services
      # block, but pinning to the upstream one is worth an explicit step.
      #
      # The wait loop is here for the same reason: `services:` would have
      # gated on a healthcheck, and a step has to do that itself. It
      # polls the endpoint MinIO itself considers "live" rather than
      # sleeping a fixed amount, so a slow runner waits longer instead of
      # producing a flake.
      - name: Start MinIO
        run: |
          docker run -d --name minio             -p 9000:9000             -e MINIO_ROOT_USER=task_api             -e MINIO_ROOT_PASSWORD=task_api_secret             minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become ready in 60s"
          docker logs minio
          exit 1

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      # `go mod tidy -diff` verifica sem escrever (Go >= 1.23). Sem este gate,
      # duas dependências diretas (moat e minio-go) ficaram marcadas como
      # `// indirect` e ninguém notou: o bloco `require` é onde se lê o que o
      # projeto escolheu depender, e o CLAUDE.md manda não adicionar
      # dependência sem critério — um go.mod que mente sobre isso enfraquece a
      # própria regra.
      - name: Modules tidy
        run: make tidy-check

      # gofmt -l lists files that are not formatted; a non-empty result
      # must fail the build instead of just being printed as a warning.
      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The default `go vet ./...` above never even compiles
      # postgres_repository_test.go (the "integration" build tag excludes
      # it), so it's vetted separately here.
      - name: Vet (integration)
        run: go vet -tags=integration ./...

      # staticcheck, not golangci-lint: see docs/ARCHITECTURE.md's Future Improvements —
      # the golangci-lint build available at the time of writing predates
      # the Go version pinned in go.mod and cannot type-check it.
      #
      # Invoked through the Makefile rather than inline, so the pinned version
      # (STATICCHECK_VERSION) lives in exactly one place. It used to be
      # `@latest` here and `@latest` there, which meant the gate was not
      # reproducible — the same commit could pass today and fail tomorrow with
      # no change of ours — and that a developer's `make lint` and this job
      # could silently run different linters.
      - name: Lint (staticcheck)
        run: make lint

      # Known vulnerabilities in what we ship. This sits with the other
      # static gates rather than with the tests because it is the same
      # kind of check: a tool answering a question about the code, with
      # no service to stand up and nothing to flake.
      #
      # Fail-closed on an *actionable* finding is the decision recorded in
      # the issue that added this step, and it is govulncheck's own
      # default rather than something configured here: the command exits
      # non-zero only for a vulnerability the code can actually reach.
      # Something present in the dependency graph but never called exits
      # 0 — verified against the golang.org/x/crypto/openpgp advisory this
      # repo currently carries, which is unreachable (we use bcrypt) and
      # has no fix, being unmaintained by design.
      #
      # The consequence accepted with that decision: an advisory against
      # the standard library can block merges until a Go release fixes
      # it. That is the trade for not letting a reachable vulnerability
      # into main unnoticed.
      #
      # Run once, with default build tags — unlike vet and staticcheck
      # above, which run twice. The second run there exists because the
      # integration-tagged files are not otherwise compiled; here it
      # would only surface vulnerabilities reachable from test helpers,
      # which are not part of what gets deployed.
      - name: Vulnerabilities (govulncheck)
        run: make vulncheck

      # Unit tests: memoryRepository, Service, Handler, config, middleware,
      # server lifecycle — everything that needs no external service.
      # postgresRepository's tests are excluded entirely (the "integration"
      # build tag means this package isn't even compiled here).
      - name: Test (unit)
        run: go test ./...

      - name: Test (unit, race detector)
        run: go test -race ./...

      - name: Test (unit, coverage)
        run: go test -cover ./...

      # Path containment is the one property in this repo where a
      # regression is both silent and severe: a blob store that stopped
      # routing keys through pathguard would still pass every
      # example-based test, because those all use well-formed UUID keys
      # that have nothing to escape with.
      #
      # 45s is a deliberate compromise — well past the seed corpus at the
      # ~100k exec/s this target sustains, short enough not to dominate
      # the job. Scoped to one target because `go test` refuses to fuzz
      # more than one per invocation.
      - name: Fuzz (path containment)
        run: go test ./internal/attachment/ -run FuzzFSBlobStore_OpenNeverEscapesRoot -fuzz FuzzFSBlobStore_OpenNeverEscapesRoot -fuzztime 45s

      # Integration tests: every integration-tagged package against the
      # real postgres service container declared above. -p 1 forces
      # packages to run sequentially rather than go test's default of one
      # concurrent process per package — they share one database/schema,
      # and internal/platform/migrate's tests in particular DROP TABLE the
      # schema other packages' tests assume is already migrated; running
      # them concurrently is a real, observed source of spurious failures.
      #
      # No `-run Postgres` filter: the build tag already selects what runs
      # here, and filtering by name on top of it silently skipped any
      # integration test not named TestPostgres_*.
      - name: Test (integration)
        run: go test -p 1 -tags=integration ./... -v

      - name: Test (integration, race detector)
        run: go test -p 1 -tags=integration -race ./...

      # Reported separately from "Test (unit, coverage)" because that step
      # cannot see integration-tagged files (not compiled) and attributes
      # coverage only within each package. This is the number that
      # reflects what the suite actually exercises.
      - name: Test (true coverage, unit + integration)
        run: |
          go test -p 1 -tags=integration -coverpkg=./... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

  # A imagem é o artefato que roda em produção, e até aqui nada no CI a
  # construía: uma regressão no build estático — uma dependência nova que
  # precise de cgo, por exemplo — só apareceria no deploy. O CLAUDE.md diz
  # explicitamente que "a new dependency that needs cgo breaks the `scratch`
  # build", e essa invariante não tinha nenhuma verificação automática.
  #
  # Job separado, e não um step do gate: não precisa de PostgreSQL nem de
  # MinIO, roda em paralelo, e uma falha aqui aponta para o Dockerfile sem
  # ambiguidade.
  docker-image:
    name: Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t task-api:ci .

      # O smoke test é também o teste de "é estático mesmo": a base é
      # `scratch`, sem libc e sem loader, então um binário dinâmico não
      # chegaria a executar. Se o container responde, ele é estático.
      #
      # Sem DATABASE_URL, o processo escolhe os repositórios em memória (ver
      # openDatabase), então não há serviço nenhum para subir.
      #
      # CSRF_SECRET é obrigatório desde a Fase 12 (docs/DECISIONS.md §
      # "Autenticação: modo duplo") — csrf.New recusa subir sem pelo menos
      # 32 bytes (moat/csrf.MinSecretLen), então o processo nem chega a
      # ouvir porta nenhuma sem isto. Valor descartável, só para o
      # container deste job existir.
      - name: Smoke test the image
        run: |
          docker run -d --name task-api-ci -p 18080:8080 \
            -e CSRF_SECRET="ci-smoke-test-throwaway-csrf-secret-00000000" \
            task-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null; then
              echo "API respondeu após ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "API não respondeu em 30s"
              docker logs task-api-ci
              exit 1
            fi
            sleep 1
          done

          echo "--- /health ---"
          curl -sf -o /dev/null -w "  status=%{http_code}\n" http://127.0.0.1:18080/health
          echo "--- /health/ready (sem banco: pronto por construção) ---"
          curl -sf -o /dev/null -w "  status=%{http_code}\n" http://127.0.0.1:18080/health/ready
          echo "--- /v1/tasks sem token deve ser 401 ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/v1/tasks)
          if [ "$code" != "401" ]; then
            echo "esperado 401, recebido $code"
            docker logs task-api-ci
            exit 1
          fi
          echo "  status=401"

      # O binário roda como 65532:65532 (ver Dockerfile). Um `USER` removido
      # por engano é o tipo de regressão que nenhum teste de comportamento
      # pega, porque a API funciona igual rodando como root.
      - name: Assert the container does not run as root
        run: |
          uid=$(docker inspect -f '{{.Config.User}}' task-api:ci)
          if [ "$uid" != "65532:65532" ]; then
            echo "esperado USER 65532:65532, encontrado \"$uid\""
            exit 1
          fi
          echo "  USER=$uid"

      - name: Stop container
        if: always()
        run: docker rm -f task-api-ci || true
