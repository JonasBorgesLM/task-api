name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    # Backs postgresRepository's integration tests (task/postgres_repository_test.go).
    # They're skipped automatically when TEST_DATABASE_URL isn't set (see
    # newPostgresTestRepo), so `go test ./...` without it still passes —
    # but running this service container is what actually exercises
    # postgresRepository on every push, instead of only when a developer
    # remembers to run `make test-postgres` locally.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: task_api
          POSTGRES_PASSWORD: task_api
          POSTGRES_DB: task_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_api -d task_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://task_api:task_api@localhost:5432/task_api?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go-version-file reads the Go version straight from go.mod, so the
      # workflow always builds with the exact version the project pins
      # instead of a hardcoded value that can drift out of sync.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      # gofmt -l lists files that are not formatted; a non-empty result
      # must fail the build instead of just being printed as a warning.
      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test (race detector)
        run: go test -race ./...

      - name: Test (coverage)
        run: go test -cover ./...
