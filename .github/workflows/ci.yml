name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    # Backs internal/task and internal/user's postgresRepository
    # integration tests (*_postgres_repository_test.go, built only with
    # -tags=integration — see the "Test (integration)" step below).
    # Without this service and that step, those tests would never actually
    # run in CI at all.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: task_api
          POSTGRES_PASSWORD: task_api
          POSTGRES_DB: task_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_api -d task_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://task_api:task_api@localhost:5432/task_api?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go-version-file reads the Go version straight from go.mod, so the
      # workflow always builds with the exact version the project pins
      # instead of a hardcoded value that can drift out of sync.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      # gofmt -l lists files that are not formatted; a non-empty result
      # must fail the build instead of just being printed as a warning.
      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The default `go vet ./...` above never even compiles
      # postgres_repository_test.go (the "integration" build tag excludes
      # it), so it's vetted separately here.
      - name: Vet (integration)
        run: go vet -tags=integration ./...

      # staticcheck, not golangci-lint: see docs/ARCHITECTURE.md's Future Improvements —
      # the golangci-lint build available at the time of writing predates
      # the Go version pinned in go.mod and cannot type-check it.
      - name: Lint (staticcheck)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          staticcheck -tags=integration ./...

      # Unit tests: memoryRepository, Service, Handler, config, middleware,
      # server lifecycle — everything that needs no external service.
      # postgresRepository's tests are excluded entirely (the "integration"
      # build tag means this package isn't even compiled here).
      - name: Test (unit)
        run: go test ./...

      - name: Test (unit, race detector)
        run: go test -race ./...

      - name: Test (unit, coverage)
        run: go test -cover ./...

      # Integration tests: every integration-tagged package against the
      # real postgres service container declared above. -p 1 forces
      # packages to run sequentially rather than go test's default of one
      # concurrent process per package — they share one database/schema,
      # and internal/platform/migrate's tests in particular DROP TABLE the
      # schema other packages' tests assume is already migrated; running
      # them concurrently is a real, observed source of spurious failures.
      - name: Test (integration)
        run: go test -p 1 -tags=integration ./... -run Postgres -v

      - name: Test (integration, race detector)
        run: go test -p 1 -tags=integration -race ./... -run Postgres
