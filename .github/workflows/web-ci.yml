name: Web CI

# Separate pipeline for web/, entirely disjoint from ci.yml's Go gate —
# see docs/DECISIONS.md § "Frontend: Vite (SPA), monorepo em web/, mesma
# linha de versão do repo" and docs/changes/web-frontend/plan.md CI-2.
# Each gate only runs for the changes it can actually judge: this one
# never touches Go, ci.yml never installs Node.
on:
  push:
    branches: [main, develop]
    paths: ['web/**']
  pull_request:
    branches: [main, develop]
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

defaults:
  run:
    working-directory: web

jobs:
  web-gate:
    name: Web Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node-version-file reads the pinned version from web/.nvmrc, the
      # same reasoning ci.yml's Go job uses go-version-file for — one
      # place declares the version, this just reads it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
