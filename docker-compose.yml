# Full local development/testing stack: the API, the PostgreSQL instance
# it talks to, and a Swagger UI for exercising the API by hand from a
# browser — all three over the compose network. Not used by CI (which
# starts a `postgres:` service container directly and runs the compiled
# test binary outside Docker — see .github/workflows/ci.yml) and not
# itself part of the production Dockerfile, which only describes the API
# image; where that image's PostgreSQL actually runs in a real deployment
# is up to that environment, addressed purely via DATABASE_URL.
#
# Usage:
#
#   docker compose up -d --build     # or: make docker-up
#   curl http://localhost:8080/health
#   open http://localhost:8082        # Swagger UI — "Try it out" just works,
#                                      # see swagger-ui/CORS_ALLOWED_ORIGINS below
#   docker compose down               # or: make docker-down
#
# To run only PostgreSQL (e.g. because you're running the API with
# `go run ./cmd/api` on the host instead, for faster edit/rebuild cycles):
#
#   docker compose up -d postgres     # or: make db-up
#
# The api and postgres services share one PostgreSQL container/volume;
# there is no separate database for the "api" service's schema versus the
# "postgres only" workflow above.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: task_api
      POSTGRES_PASSWORD: task_api
      POSTGRES_DB: task_api
    ports:
      - "5432:5432"
    volumes:
      - task-api-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_api -d task_api"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Object storage for attachments, and the local stand-in for S3.
  #
  # It is here so the S3 code path is exercised by the same developers
  # and the same integration suite that exercise the filesystem one —
  # a backend only ever run in production is a backend nobody has tested.
  # minio-go speaks to this and to real S3 identically, which is what
  # makes that substitution honest rather than a mock.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: task_api
      MINIO_ROOT_PASSWORD: task_api_secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console, for looking at what landed
    volumes:
      - task-api-minio-data:/data
    healthcheck:
      # mc is not in this image; the readiness endpoint is, and it is
      # what the server itself considers "ready to serve".
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Creates the bucket once MinIO is up, then exits. A bucket is not
  # created on demand by the application (see attachment.NewS3BlobStore
  # for why), so something has to make it, and doing it here keeps
  # `make db-up`-style one-command setup working.
  minio-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 task_api task_api_secret &&
      mc mb --ignore-existing local/task-api-attachments &&
      echo 'bucket ready'
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-api:latest
    environment:
      # "postgres" resolves via Docker's embedded DNS to the postgres
      # service above — not "localhost", which inside this container
      # would mean the api container itself.
      DATABASE_URL: postgres://task_api:task_api@postgres:5432/task_api?sslmode=disable
      HTTP_ADDR: ":8080"
      # Defaults to the swagger-ui service's own origin below (port 8082
      # on the host — see its ports:), so "Try it out" in the bundled
      # Swagger UI works with zero extra setup (see
      # config.Config.CORSAllowedOrigins). Compose reads .env
      # automatically, so override it there — never commit .env, see
      # .gitignore — to allow a different origin (a separately-run
      # frontend on another port) instead, or set it to an empty value to
      # disable CORS again.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8082}
      # Attachments are opt-in (see config.Config.AttachmentStorageDir):
      # without ATTACHMENT_STORAGE_DIR or the ATTACHMENT_S3_* variables
      # set, attachmentsEnabled(cfg) is false and the upload/download
      # routes are never registered — they 404 rather than existing and
      # failing. This stack's minio and minio-bucket services below exist
      # specifically so the S3 backend is exercised by whoever runs
      # `docker compose up`, the same reasoning that put MinIO in the CI
      # pipeline (see .github/workflows/ci.yml) — a backend only ever run
      # in production is a backend nobody has tested. Pointing api at it
      # is what makes that true locally too.
      ATTACHMENT_S3_ENDPOINT: minio:9000
      ATTACHMENT_S3_BUCKET: task-api-attachments
      ATTACHMENT_S3_ACCESS_KEY: task_api
      ATTACHMENT_S3_SECRET_KEY: task_api_secret
      ATTACHMENT_S3_USE_SSL: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Waits for the bucket to actually exist, not just for MinIO to be
      # reachable — minio-bucket's own depends_on already covers "MinIO
      # is healthy" (see below), and service_completed_successfully is
      # what lets api wait one step further, for the one-shot job that
      # runs after it. Without this, `docker compose up` could start api
      # and minio-bucket at the same moment MinIO reports healthy, and
      # the first upload would race NewS3BlobStore's own BucketExists
      # check against mc still creating the bucket.
      minio-bucket:
        condition: service_completed_successfully
    # Restart on crash, but stay down after an explicit `docker compose
    # stop` / `down`. The API exits non-zero when it cannot reach
    # PostgreSQL at startup (see openDatabase's Ping), so without this a
    # transient database blip during boot leaves the container dead until
    # someone notices.
    restart: unless-stopped
    # There is deliberately no healthcheck here. The runtime image is
    # built FROM scratch (see Dockerfile) and contains nothing but the
    # binary — no shell, no curl, no wget — so every shell- or
    # tool-based Compose healthcheck would fail regardless of whether the
    # API is actually healthy. The application does expose GET
    # /health/ready for this purpose; a real orchestrator (Kubernetes,
    # ECS, a load balancer) probes it over HTTP without needing anything
    # installed inside the container, which is the correct place for that
    # check to live.

  # Interactive API console for manual testing — not something the API
  # itself needs at runtime, and not started by the production Dockerfile;
  # purely a convenience for this compose-based dev stack. Serves
  # docs/openapi.yaml (mounted read-only, so editing the spec on the host
  # and reloading the page in the browser is enough to see the change — no
  # rebuild) and lets "Try it out" call the real api service directly from
  # the browser, which is what api's CORS_ALLOWED_ORIGINS default above
  # exists to allow: without it, the browser blocks that cross-origin call
  # even though the request itself reaches the API (this is the exact
  # problem CORS support was added to solve — see docs/ARCHITECTURE.md).
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.13
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "8082:8080"
    restart: unless-stopped

volumes:
  task-api-postgres-data:
  task-api-minio-data:
